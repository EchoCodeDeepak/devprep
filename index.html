<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DevPrep — PHP &amp; Laravel Interview Preparation</title>
  <meta name="description" content="A personal interview knowledge base for PHP and Laravel developers: interview-ready answers, detailed explanations, code examples, coding problems, flashcards and revision tracking.">
  <meta name="theme-color" content="#f6f7f9" id="theme-color">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DevPrep — PHP &amp; Laravel Interview Preparation">
  <meta property="og:description" content="Interview-ready answers, detailed explanations, code examples and practice modes for PHP, Laravel, MySQL, JavaScript and more.">
  <meta property="og:image" content="assets/icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply the saved theme before first paint so there is no flash.
    (function () {
      var theme = null, motion = null;
      try {
        var s = JSON.parse(localStorage.getItem('devprep:v1') || '{}').settings || {};
        theme = s.theme; motion = s.reduceMotion;
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      if (motion) document.documentElement.dataset.motion = 'reduced';
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="#main" class="btn btn-primary sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-[60]">Skip to content</a>

  <div id="app" class="min-h-dvh lg:pl-64">
    <aside id="sidebar" aria-label="Main navigation"></aside>
    <header id="topbar"></header>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl px-4 pb-28 pt-5 outline-none sm:px-6 lg:px-8 lg:pb-16 lg:pt-8">
      <div class="space-y-4" aria-busy="true" aria-label="Loading questions">
        <div class="skeleton h-8 w-48"></div>
        <div class="grid grid-cols-2 gap-3 md:grid-cols-3">
          <div class="skeleton h-24"></div><div class="skeleton h-24"></div><div class="skeleton h-24"></div>
        </div>
        <div class="skeleton h-64"></div>
      </div>
    </main>
    <nav id="tabbar" aria-label="Quick navigation"></nav>
  </div>

  <div id="overlays"></div>
  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-20 z-[70] flex flex-col items-center gap-2 px-4 lg:bottom-6" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:2rem;font-family:system-ui">DevPrep runs entirely in your browser and needs JavaScript turned on.</p>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
